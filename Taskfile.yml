version: '3'

tasks:
  setup:
    desc: Build .venv
    cmds:
      - uv sync

  test:
    desc: Run the tests
    cmds:
      - uv run pytest --quiet

  lint:
    desc: Lint, and check formatting
    cmds:
      - uv run ruff check
      - uv run ruff format --check

  check:
    desc: Lint, then test, failing on any problem
    cmds:
      - task: lint
      - task: test
